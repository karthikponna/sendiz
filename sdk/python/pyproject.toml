[project]
name = "sendiz"
version = "0.1.0"
description = "Python client for the Sendiz email API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["typing_extensions>=4.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://sendiz.dev"
Source = "https://github.com/karthikponna/sendiz/tree/main/sdk/python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
